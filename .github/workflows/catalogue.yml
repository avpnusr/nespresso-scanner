name: catalogue

on:
  push:
    paths:
      - 'scan.py'
      - 'images.py'
      - '.github/workflows/catalogue.yml'
  schedule:
    # twice a day, UTC
    - cron: '22 5,17 * * *'
  workflow_dispatch:
    inputs:
      redraw:
        description: 'Space-separated SKUs whose banners to redraw (e.g. "7429.20 7200.20")'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the Nespresso catalogue
        run: |
          python3 scan.py --selftest
          python3 scan.py
          # Pillow scales and encodes the banners; the repo itself stays stdlib-only
          python3 -m pip install --quiet --break-system-packages pillow \
            || python3 -m pip install --quiet pillow
          python3 images.py --selftest

      - name: Draw a banner for capsules without one
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDRAW: ${{ github.event.inputs.redraw }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "no OPENAI_API_KEY secret; skipping banner generation"
            exit 0
          fi
          if [ -n "$REDRAW" ]; then
            # a dispatch with `redraw` names the capsules whose banners came out wrong;
            # --sku overwrites them
            python3 images.py generate $(printf -- '--sku %s ' $REDRAW) \
              || echo "redraw failed; the catalogue scan is unaffected"
            exit 0
          fi
          # --limit is per line: at most five Original and five Vertuo banners a run.
          # A failed drawing must not stop the catalogue scan, so it only warns.
          python3 images.py generate --limit 5 \
            || echo "banner generation failed; the catalogue scan is unaffected"

      - name: Refresh the list of capsules still needing a banner
        run: python3 images.py prompts

      - name: Commit the catalogue, banners and prompt list if they changed
        run: |
          git config user.name "nespresso-scanner"
          git config user.email "nespresso-scanner@users.noreply.github.com"
          git add catalogue.json prompts/needs-images.md images
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "catalogue: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
